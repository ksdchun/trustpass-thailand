<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 788" role="img" aria-labelledby="title desc">
  <title id="title">TrustPass Thailand current product flow</title>
  <desc id="desc">Tourist chat and evidence flow through OCR, scope checking, deterministic grounding, Azure OpenAI reasoning, action cards, and a Caution-or-higher dashboard.</desc>
  <rect width="1400" height="788" fill="#F8FBFF"/>
  <text x="700" y="62" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="700" fill="#005A9E">TrustPass Thailand</text>
  <text x="700" y="101" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#323130">Chat + evidence, grounded before Azure AI reasoning</text>

  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#0078D4"/>
    </marker>
  </defs>

  <g font-family="Segoe UI, Arial, sans-serif">
    <g filter="url(#shadow)">
      <rect x="38" y="155" width="205" height="462" rx="8" fill="#FFFFFF" stroke="#D2E3F8"/>
      <rect x="38" y="155" width="205" height="54" rx="8" fill="#0078D4"/>
      <text x="140" y="190" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">1. Tourist Case</text>
      <rect x="68" y="244" width="145" height="270" rx="28" fill="#111827"/>
      <rect x="80" y="260" width="121" height="238" rx="18" fill="#F3F8FF"/>
      <text x="140" y="293" text-anchor="middle" font-size="14" font-weight="700" fill="#005A9E">Risk Check</text>
      <rect x="96" y="320" width="90" height="58" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
      <text x="141" y="344" text-anchor="middle" font-size="12" fill="#323130">Describe</text>
      <text x="141" y="362" text-anchor="middle" font-size="12" fill="#323130">situation</text>
      <rect x="96" y="398" width="90" height="58" rx="10" fill="#EAF4FE" stroke="#A9D3F5"/>
      <text x="141" y="422" text-anchor="middle" font-size="12" fill="#323130">Attach</text>
      <text x="141" y="440" text-anchor="middle" font-size="12" fill="#323130">evidence</text>
      <text x="140" y="552" text-anchor="middle" font-size="14" fill="#605E5C">Text, image, PDF</text>
    </g>

    <path d="M260 386 H315" stroke="#0078D4" stroke-width="6" marker-end="url(#arrow)" fill="none"/>

    <g filter="url(#shadow)">
      <rect x="332" y="155" width="230" height="462" rx="8" fill="#FFFFFF" stroke="#D2E3F8"/>
      <rect x="332" y="155" width="230" height="54" rx="8" fill="#0078D4"/>
      <text x="447" y="190" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">2. Evidence Readout</text>
      <rect x="362" y="248" width="170" height="92" rx="8" fill="#F8FBFF" stroke="#BBD7F5"/>
      <text x="447" y="279" text-anchor="middle" font-size="17" font-weight="700" fill="#005A9E">Azure Document</text>
      <text x="447" y="303" text-anchor="middle" font-size="17" font-weight="700" fill="#005A9E">Intelligence</text>
      <text x="447" y="330" text-anchor="middle" font-size="13" fill="#605E5C">OCR when configured</text>
      <rect x="362" y="368" width="170" height="74" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="447" y="397" text-anchor="middle" font-size="14" font-weight="700" fill="#323130">Detected hints</text>
      <text x="447" y="421" text-anchor="middle" font-size="13" fill="#605E5C">prices, accounts, places</text>
      <rect x="362" y="468" width="170" height="74" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="447" y="497" text-anchor="middle" font-size="14" font-weight="700" fill="#323130">Fallback mode</text>
      <text x="447" y="521" text-anchor="middle" font-size="13" fill="#605E5C">asks user to paste text</text>
    </g>

    <path d="M580 386 H635" stroke="#0078D4" stroke-width="6" marker-end="url(#arrow)" fill="none"/>

    <g filter="url(#shadow)">
      <rect x="652" y="155" width="250" height="462" rx="8" fill="#FFFFFF" stroke="#D2E3F8"/>
      <rect x="652" y="155" width="250" height="54" rx="8" fill="#0078D4"/>
      <text x="777" y="190" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">3. Grounding Gate</text>
      <rect x="682" y="242" width="190" height="78" rx="8" fill="#F8FBFF" stroke="#BBD7F5"/>
      <text x="777" y="271" text-anchor="middle" font-size="15" font-weight="700" fill="#005A9E">Scope check</text>
      <text x="777" y="296" text-anchor="middle" font-size="13" fill="#605E5C">Rejects unrelated requests</text>
      <rect x="682" y="346" width="190" height="78" rx="8" fill="#FFF7ED" stroke="#FDBA74"/>
      <text x="777" y="375" text-anchor="middle" font-size="15" font-weight="700" fill="#9A3412">Evidence consistency</text>
      <text x="777" y="400" text-anchor="middle" font-size="13" fill="#605E5C">Asks if topics mismatch</text>
      <rect x="682" y="450" width="190" height="92" rx="8" fill="#F0FDF4" stroke="#86EFAC"/>
      <text x="777" y="479" text-anchor="middle" font-size="15" font-weight="700" fill="#107C10">Deterministic tools</text>
      <text x="777" y="504" text-anchor="middle" font-size="13" fill="#605E5C">taxi, food, payment,</text>
      <text x="777" y="523" text-anchor="middle" font-size="13" fill="#605E5C">rental, job-lure patterns</text>
    </g>

    <path d="M920 386 H975" stroke="#0078D4" stroke-width="6" marker-end="url(#arrow)" fill="none"/>

    <g filter="url(#shadow)">
      <rect x="992" y="155" width="185" height="462" rx="8" fill="#FFFFFF" stroke="#D2E3F8"/>
      <rect x="992" y="155" width="185" height="54" rx="8" fill="#0078D4"/>
      <text x="1084" y="190" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">4. Azure OpenAI</text>
      <circle cx="1084" cy="299" r="55" fill="#EAF4FE" stroke="#A9D3F5"/>
      <text x="1084" y="293" text-anchor="middle" font-size="18" font-weight="700" fill="#005A9E">GPT-4o</text>
      <text x="1084" y="318" text-anchor="middle" font-size="13" fill="#605E5C">deployment</text>
      <rect x="1022" y="390" width="125" height="92" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="1084" y="421" text-anchor="middle" font-size="14" font-weight="700" fill="#323130">Structured JSON</text>
      <text x="1084" y="446" text-anchor="middle" font-size="13" fill="#605E5C">risk, signals,</text>
      <text x="1084" y="465" text-anchor="middle" font-size="13" fill="#605E5C">next steps, report</text>
    </g>

    <path d="M1194 386 H1249" stroke="#0078D4" stroke-width="6" marker-end="url(#arrow)" fill="none"/>

    <g filter="url(#shadow)">
      <rect x="1265" y="155" width="105" height="462" rx="8" fill="#FFFFFF" stroke="#D2E3F8"/>
      <rect x="1265" y="155" width="105" height="54" rx="8" fill="#0078D4"/>
      <text x="1318" y="181" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">5. Output</text>
      <rect x="1280" y="242" width="76" height="54" rx="8" fill="#FEF3C7" stroke="#F59E0B"/>
      <text x="1318" y="274" text-anchor="middle" font-size="13" font-weight="700" fill="#92400E">Risk card</text>
      <rect x="1280" y="322" width="76" height="54" rx="8" fill="#EAF4FE" stroke="#A9D3F5"/>
      <text x="1318" y="354" text-anchor="middle" font-size="13" font-weight="700" fill="#005A9E">Thai phrase</text>
      <rect x="1280" y="402" width="76" height="54" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
      <text x="1318" y="434" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">Report</text>
      <rect x="1280" y="482" width="76" height="72" rx="8" fill="#FEF2F2" stroke="#FCA5A5"/>
      <text x="1318" y="510" text-anchor="middle" font-size="13" font-weight="700" fill="#991B1B">Dashboard</text>
      <text x="1318" y="532" text-anchor="middle" font-size="11" fill="#605E5C">Caution+</text>
    </g>

    <rect x="75" y="670" width="1250" height="62" rx="8" fill="#EAF4FE" stroke="#A9D3F5"/>
    <text x="700" y="706" text-anchor="middle" font-size="18" font-weight="700" fill="#005A9E">OCR supports the user story; weak, unrelated, or mismatched evidence is ignored or clarified before scoring.</text>
  </g>
</svg>
